name: HorseRacingAI Autorun Watchdog

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/autorun_watchdog.yml'
      - 'automation/**'
      - 'outputs/automation/**'
  schedule:
    - cron: '35 14 * * 0'   # Sunday 23:35 JST
    - cron: '0 */6 * * *'   # periodic visibility check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check automation status
        id: check
        shell: bash
        run: |
          set -euo pipefail

          now_epoch="$(TZ=Asia/Tokyo date +%s)"
          now_jst="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %Z')"
          dow="$(TZ=Asia/Tokyo date +%u)" # Mon=1 ... Sun=7
          status_file="outputs/automation/LATEST_STATUS.txt"
          max_running_seconds=$((3 * 60 * 60))

          # Most recent Sunday in JST. Before the Sunday 23:30 deadline, the required
          # successful run is still the previous Sunday; after the deadline it is today.
          days_since_sunday=$(( dow % 7 ))
          latest_sunday="$(TZ=Asia/Tokyo date -d "-$days_since_sunday day" '+%Y-%m-%d')"
          deadline_epoch="$(TZ=Asia/Tokyo date -d "$latest_sunday 23:30:00" +%s)"
          if (( now_epoch < deadline_epoch )); then
            required_sunday="$(TZ=Asia/Tokyo date -d "$latest_sunday -7 day" '+%Y-%m-%d')"
          else
            required_sunday="$latest_sunday"
          fi

          echo "checked_at=$now_jst" >> "$GITHUB_OUTPUT"
          echo "required_sunday=$required_sunday" >> "$GITHUB_OUTPUT"

          if [[ ! -f "$status_file" ]]; then
            echo "state=MISSING_REQUIRED_SUCCESS" >> "$GITHUB_OUTPUT"
            echo "detail=No status file; required Sunday SUCCESS date is $required_sunday" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(tr -d '\r' < "$status_file" | tail -n 1)"
          echo "raw_status<<EOF" >> "$GITHUB_OUTPUT"
          echo "$status" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if grep -q '^FAILED ' <<<"$status"; then
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "detail=$status" >> "$GITHUB_OUTPUT"
          elif grep -q '^RUNNING ' <<<"$status"; then
            # RUNNING is only healthy while it is genuinely recent. A hung task must not
            # hide the Sunday 23:30 missing-SUCCESS condition indefinitely.
            ts="$(awk '{print $2}' <<<"$status")"
            if running_epoch="$(date -d "$ts" +%s 2>/dev/null)"; then
              running_age=$(( now_epoch - running_epoch ))
            else
              running_age=$(( max_running_seconds + 1 ))
            fi

            if (( running_age > max_running_seconds )); then
              echo "state=STALE_RUNNING" >> "$GITHUB_OUTPUT"
              echo "detail=RUNNING has not completed for ${running_age}s (limit ${max_running_seconds}s): $status" >> "$GITHUB_OUTPUT"
            elif (( now_epoch >= deadline_epoch )) && grep -q "$latest_sunday" <<<"$status"; then
              echo "state=MISSING_REQUIRED_SUCCESS" >> "$GITHUB_OUTPUT"
              echo "detail=Sunday 23:30 deadline passed without SUCCESS; latest status is: $status" >> "$GITHUB_OUTPUT"
            else
              echo "state=RUNNING" >> "$GITHUB_OUTPUT"
              echo "detail=$status" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q '^SUCCESS ' <<<"$status"; then
            if grep -q "$required_sunday" <<<"$status"; then
              echo "state=HEALTHY" >> "$GITHUB_OUTPUT"
              echo "detail=$status" >> "$GITHUB_OUTPUT"
            else
              echo "state=MISSING_REQUIRED_SUCCESS" >> "$GITHUB_OUTPUT"
              echo "detail=Latest status is '$status'; required Sunday SUCCESS date is $required_sunday" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "detail=$status" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update watchdog issue on abnormal state
        if: steps.check.outputs.state != 'HEALTHY' && steps.check.outputs.state != 'RUNNING'
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.check.outputs.state }}
          DETAIL: ${{ steps.check.outputs.detail }}
          CHECKED_AT: ${{ steps.check.outputs.checked_at }}
          REQUIRED_SUNDAY: ${{ steps.check.outputs.required_sunday }}
        with:
          script: |
            const title = '[AUTO] HorseRacingAI autorun abnormal';
            const body = [
              'HorseRacingAI autorun watchdog detected an abnormal state.',
              '',
              `- Checked at: ${process.env.CHECKED_AT}`,
              `- Required Sunday: ${process.env.REQUIRED_SUNDAY}`,
              `- State: ${process.env.STATE}`,
              `- Detail: ${process.env.DETAIL}`,
              '',
              'The weekly job is expected at Sunday 20:30 JST and is considered abnormal if that Sunday has no SUCCESS by 23:30 JST. RUNNING is also abnormal if it remains unchanged for more than 3 hours.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close watchdog issue after recovery
        if: steps.check.outputs.state == 'HEALTHY'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO] HorseRacingAI autorun abnormal';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered: required Sunday SUCCESS is now present.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Fail workflow for visibility
        if: steps.check.outputs.state != 'HEALTHY' && steps.check.outputs.state != 'RUNNING'
        shell: bash
        run: |
          echo "HorseRacingAI autorun abnormal: ${{ steps.check.outputs.state }}"
          exit 1
