name: HorseRacingAI Autorun Watchdog

on:
  schedule:
    - cron: '35 14 * * 0'   # Sunday 23:35 JST
    - cron: '0 */6 * * *'   # periodic visibility check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check automation status
        id: check
        shell: bash
        run: |
          set -euo pipefail
          now_jst="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %Z')"
          today_jst="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          status_file="outputs/automation/LATEST_STATUS.txt"

          echo "checked_at=$now_jst" >> "$GITHUB_OUTPUT"
          echo "today_jst=$today_jst" >> "$GITHUB_OUTPUT"

          if [[ ! -f "$status_file" ]]; then
            echo "state=MISSING" >> "$GITHUB_OUTPUT"
            echo "detail=outputs/automation/LATEST_STATUS.txt is missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(tr -d '\r' < "$status_file" | tail -n 1)"
          echo "raw_status<<EOF" >> "$GITHUB_OUTPUT"
          echo "$status" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if grep -q '^FAILED ' <<<"$status"; then
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "detail=$status" >> "$GITHUB_OUTPUT"
          elif grep -q '^SUCCESS ' <<<"$status"; then
            if grep -q "$today_jst" <<<"$status"; then
              echo "state=SUCCESS_TODAY" >> "$GITHUB_OUTPUT"
              echo "detail=$status" >> "$GITHUB_OUTPUT"
            else
              echo "state=STALE_SUCCESS" >> "$GITHUB_OUTPUT"
              echo "detail=$status" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q '^RUNNING ' <<<"$status"; then
            echo "state=RUNNING" >> "$GITHUB_OUTPUT"
            echo "detail=$status" >> "$GITHUB_OUTPUT"
          else
            echo "state=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "detail=$status" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update watchdog issue on abnormal state
        if: steps.check.outputs.state != 'SUCCESS_TODAY' && steps.check.outputs.state != 'RUNNING'
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.check.outputs.state }}
          DETAIL: ${{ steps.check.outputs.detail }}
          CHECKED_AT: ${{ steps.check.outputs.checked_at }}
        with:
          script: |
            const title = '[AUTO] HorseRacingAI autorun abnormal';
            const body = [
              'HorseRacingAI autorun watchdog detected an abnormal state.',
              '',
              `- Checked at: ${process.env.CHECKED_AT}`,
              `- State: ${process.env.STATE}`,
              `- Detail: ${process.env.DETAIL}`,
              '',
              'This issue is generated by the GitHub-side watchdog. The local JV-Link/evaluation job still requires the Windows PC scheduled task to run.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail workflow for visibility
        if: steps.check.outputs.state != 'SUCCESS_TODAY' && steps.check.outputs.state != 'RUNNING'
        shell: bash
        run: |
          echo "HorseRacingAI autorun abnormal: ${{ steps.check.outputs.state }}"
          exit 1
